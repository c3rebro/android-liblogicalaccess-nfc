name: JVM tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run hardware-independent tests
        run: gradle --no-daemon :core-project:test :core-execution:test :core-usecase:test :rfidgear-runtime:test

      - name: Compile Android Kotlin/UI sources
        run: gradle --no-daemon :app:compileDebugKotlin
